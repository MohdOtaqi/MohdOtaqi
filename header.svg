<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 1.5px;
      fill: url(#nameGrad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, monospace;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #00F2FE;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.3px;
      fill: #94A3B8;
    }
    .tag-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="140" cy="40" r="90" fill="#0052CC" opacity="0.30" filter="url(#glow)" />
  <circle cx="860" cy="180" r="110" fill="#00F2FE" opacity="0.20" filter="url(#glow)" />
  <circle cx="480" cy="220" r="70" fill="#0284C7" opacity="0.15" filter="url(#glow)" />

  <!-- Top Accent Light Line -->
  <rect x="120" y="0" width="760" height="2" fill="url(#borderGrad)" />

  <!-- Top Pill Badge -->
  <rect x="50" y="34" width="310" height="26" rx="13" fill="#0F172A" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
  <circle cx="66" cy="47" r="4" fill="#00F2FE" />
  <text x="80" y="51" class="badge-text">SOFTWARE &amp; MOBILE ENGINEER</text>

  <!-- Main Title -->
  <text x="50" y="108" class="title-text">MOHAMMAD OTAQI</text>

  <!-- Subtitle -->
  <text x="50" y="144" class="subtitle-text">
    Fintech &amp; Capital Markets Infrastructure <tspan fill="#00F2FE">•</tspan> Flutter &amp; Mobile Apps <tspan fill="#00F2FE">•</tspan> Real-Time Systems
  </text>

  <!-- ═══════════════ INDEPENDENT ABSOLUTE TAG BOXES ═══════════════ -->
  <!-- Tag 1: ZagTrader .NET -->
  <rect x="50" y="174" width="138" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="119" y="189" class="tag-label">ZagTrader .NET 10</text>

  <!-- Tag 2: Flutter / BLoC -->
  <rect x="200" y="174" width="135" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="267" y="189" class="tag-label">Flutter / BLoC</text>

  <!-- Tag 3: LiveKit WebRTC -->
  <rect x="347" y="174" width="138" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="416" y="189" class="tag-label">LiveKit WebRTC</text>

  <!-- Tag 4: SWIFT ISO 15022 -->
  <rect x="497" y="174" width="145" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="569" y="189" class="tag-label">SWIFT ISO 15022</text>

  <!-- Tag 5: Amman, Jordan -->
  <rect x="654" y="174" width="135" height="30" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="721" y="189" class="tag-label">Amman, Jordan 🇯🇴</text>

  <!-- Right Geometric Tech Graphics -->
  <g transform="translate(870, 115)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#334155" stroke-dasharray="5,5" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="1.5" />
    <circle cx="0" cy="0" r="26" fill="#00F2FE" fill-opacity="0.08" stroke="#00F2FE" stroke-opacity="0.8" stroke-width="1.5" />
    <path d="M-7,0 L7,0 M0,-7 L0,7" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
    <circle cx="-7" cy="0" r="2" fill="#FFFFFF" />
    <circle cx="7" cy="0" r="2" fill="#FFFFFF" />
    <circle cx="0" cy="-7" r="2" fill="#FFFFFF" />
    <circle cx="0" cy="7" r="2" fill="#FFFFFF" />
  </g>

  <!-- Bottom Accent Highlight -->
  <rect x="220" y="238" width="560" height="2" fill="url(#borderGrad)" />
</svg>
