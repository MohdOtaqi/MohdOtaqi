<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 900; font-size: 48px; letter-spacing: 1.5px; fill: url(#nameGrad); }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #00F2FE; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 16px; fill: #94A3B8; }
    .accent { fill: #00F2FE; }
  </style>

  <!-- Background -->
  <rect width="1000" height="200" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="130" cy="30" r="90" fill="#0052CC" opacity="0.30" filter="url(#glow)" />
  <circle cx="870" cy="160" r="110" fill="#00F2FE" opacity="0.20" filter="url(#glow)" />
  <circle cx="500" cy="190" r="60" fill="#0284C7" opacity="0.12" filter="url(#glow)" />

  <!-- Top Accent Line -->
  <rect x="120" y="0" width="760" height="2" fill="url(#borderGrad)" />

  <!-- Pill Badge -->
  <rect x="50" y="30" width="310" height="26" rx="13" fill="#0F172A" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
  <circle cx="66" cy="43" r="4" fill="#00F2FE" />
  <text x="80" y="47" class="badge">SOFTWARE &amp; MOBILE ENGINEER</text>

  <!-- Name -->
  <text x="50" y="105" class="title">MOHAMMAD OTAQI</text>

  <!-- Subtitle -->
  <text x="50" y="145" class="subtitle">Fintech &amp; Capital Markets <tspan class="accent">&#x2022;</tspan> Flutter &amp; Mobile Apps <tspan class="accent">&#x2022;</tspan> Real-Time Systems</text>

  <!-- Location -->
  <text x="50" y="178" class="subtitle" style="font-size:14px; fill:#64748B;">Amman, Jordan</text>

  <!-- Right Geometric -->
  <g transform="translate(870, 100)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#334155" stroke-dasharray="5,5" stroke-width="1.5" opacity="0.5" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="0" cy="0" r="24" fill="#00F2FE" fill-opacity="0.07" stroke="#00F2FE" stroke-opacity="0.7" stroke-width="1.5" />
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Accent Line -->
  <rect x="220" y="198" width="560" height="2" fill="url(#borderGrad)" />
</svg>
