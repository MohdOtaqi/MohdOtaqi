<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0D131F" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 1.5px;
      fill: url(#nameGrad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, monospace;
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: 2px;
      fill: #00F2FE;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.3px;
      fill: #94A3B8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #E2E8F0;
      dominant-baseline: middle;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="140" cy="40" r="90" fill="#0052CC" opacity="0.30" filter="url(#glow)" />
  <circle cx="860" cy="180" r="110" fill="#00F2FE" opacity="0.22" filter="url(#glow)" />
  <circle cx="480" cy="220" r="70" fill="#0284C7" opacity="0.18" filter="url(#glow)" />

  <!-- Top Accent Light Line -->
  <rect x="120" y="0" width="760" height="2" fill="url(#borderGrad)" />

  <!-- Left Content Group -->
  <g transform="translate(50, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 34)">
      <rect x="0" y="0" width="320" height="26" rx="13" fill="#0F172A" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="13" r="4" fill="#00F2FE" />
      <text x="30" y="17" class="badge-text">SOFTWARE &amp; MOBILE ENGINEER</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="108" class="title-text">MOHAMMAD OTAQI</text>

    <!-- Subtitle -->
    <text x="0" y="144" class="subtitle-text">
      Fintech &amp; Capital Markets Infrastructure <tspan fill="#00F2FE">•</tspan> Flutter &amp; Mobile Apps <tspan fill="#00F2FE">•</tspan> Real-Time Systems
    </text>

    <!-- Bottom Feature Tags Row with Fixed Independent Transforms -->
    <g transform="translate(0, 178)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="10" y="15" class="tag-text">🏛️ ZagTrader .NET</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="135" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="10" y="15" class="tag-text">📱 Flutter / BLoC</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(293, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="10" y="15" class="tag-text">⚡ LiveKit WebRTC</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(441, 0)">
        <rect x="0" y="0" width="145" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="10" y="15" class="tag-text">🔒 SWIFT ISO 15022</text>
      </g>

      <!-- Tag 5 -->
      <g transform="translate(596, 0)">
        <rect x="0" y="0" width="135" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="10" y="15" class="tag-text">📍 Amman, Jordan</text>
      </g>
    </g>
  </g>

  <!-- Right Geometric Tech Graphics -->
  <g transform="translate(865, 115)">
    <!-- Outer Dashed Ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#334155" stroke-dasharray="5,5" stroke-width="1.5" opacity="0.6" />
    <!-- Middle Cyan Glow Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="1.5" />
    <!-- Inner Core -->
    <circle cx="0" cy="0" r="28" fill="#00F2FE" fill-opacity="0.08" stroke="#00F2FE" stroke-opacity="0.8" stroke-width="1.5" />
    <!-- Tech Node Icon / Cross -->
    <path d="M-8,0 L8,0 M0,-8 L0,8" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" />
    <circle cx="-8" cy="0" r="2" fill="#FFFFFF" />
    <circle cx="8" cy="0" r="2" fill="#FFFFFF" />
    <circle cx="0" cy="-8" r="2" fill="#FFFFFF" />
    <circle cx="0" cy="8" r="2" fill="#FFFFFF" />
  </g>

  <!-- Bottom Accent Highlight -->
  <rect x="220" y="238" width="560" height="2" fill="url(#borderGrad)" />
</svg>
