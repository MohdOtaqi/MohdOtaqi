<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <linearGradient id="footerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#4FACFE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .footer-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
      fill: #94A3B8;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .highlight {
      fill: #00F2FE;
      font-weight: 700;
    }
  </style>

  <!-- Base Container -->
  <rect width="1000" height="80" rx="12" fill="url(#footerBg)" stroke="#1E293B" stroke-width="1" />

  <!-- Top Glowing Light Line -->
  <rect x="100" y="0" width="800" height="2" fill="url(#footerGlow)" />

  <!-- Center Text -->
  <text x="500" y="42" class="footer-text">
    <tspan class="highlight">12+ Apps &amp; Systems Shipped</tspan> • <tspan class="highlight">3+ Years Building</tspan> • Amman, Jordan 🇯🇴
  </text>
</svg>
