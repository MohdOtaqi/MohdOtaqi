<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="Sehleh - Services Marketplace">
  <title>Sehleh</title>
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101C"/><stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="top4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip4"><rect width="600" height="250" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip4)">
    <rect width="600" height="250" fill="url(#g4)"/>
    <circle cx="66" cy="58" r="130" fill="url(#halo4)"/>

    <rect x="-260" y="0" width="260" height="250" fill="url(#sheen4)">
      <animate attributeName="x" values="-260;600" dur="4.5s" begin="5.6s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="600" height="2.5" fill="url(#top4)"/>

    <g transform="translate(34 34)"><path d="M17 32s11-11.4 11-19A11 11 0 0 0 6 13c0 7.6 11 19 11 19z" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round"/><circle cx="17" cy="13" r="4.2" fill="none" stroke="#FBBF24" stroke-width="2"/></g>

    <text x="86" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F1F5F9">Sehleh</text>
    <text x="86" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#FBBF24" fill-opacity="0.85">SERVICES MARKETPLACE</text>

    <g transform="translate(488.8 26)">
      <rect width="77.2" height="24" rx="12" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.35"/>
      <circle cx="13" cy="12" r="3.2" fill="#FBBF24"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="44.6" y="16.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#FBBF24">PRIVATE</text>
    </g>

    <rect x="34" y="94" width="46" height="2" rx="1" fill="#FBBF24" fill-opacity="0.5"/>
    <text x="34" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Twin customer and provider apps with PostGIS</text><text x="34" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">geolocation, live provider tracking, in-app chat</text><text x="34" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">and Stripe + Tap payments. Next.js admin panel.</text>
    <g transform="translate(34.0 196)"><rect width="73.1" height="26" rx="7" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">Flutter</text></g><g transform="translate(115.1 196)"><rect width="51.2" height="26" rx="7" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.30"/><text x="25.6" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">BLoC</text></g><g transform="translate(174.3 196)"><rect width="80.4" height="26" rx="7" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.30"/><text x="40.2" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">Supabase</text></g><g transform="translate(262.7 196)"><rect width="73.1" height="26" rx="7" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">PostGIS</text></g>

    <rect width="600" height="250" rx="16" fill="none" stroke="#1A2739" stroke-width="1.5"/>
  </g>
</svg>
