      <animate attributeName="x" values="-260;600" dur="4.5s" begin="4.199999999999999s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="600" height="2.5" fill="url(#top8)"/>

    <g transform="translate(34 34)"><circle cx="10" cy="17" r="8" fill="none" stroke="#A78BFA" stroke-width="2"/><path d="M18 17h15M28 17v6M23 17v4" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/></g>

    <text x="86" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F1F5F9">ZagKeyGenWeb</text>
    <text x="86" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#A78BFA" fill-opacity="0.85">ZAGTRADER</text>

