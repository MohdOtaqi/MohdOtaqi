      <text x="56.0" y="16.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#A78BFA">ENTERPRISE</text>
    </g>

