<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 172" width="1000" height="172" role="img" aria-label="MOT — LFG matchmaking by game, platform and playstyle. Real-time chat, a 300+ game database via RAWG, automated moderation and a RevenueCat store.">
  <title>MOT</title>
  <defs>
    <linearGradient id="sweep2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rc2"><rect width="1000" height="172" rx="5"/></clipPath>
  </defs>

  <g clip-path="url(#rc2)">
    <rect width="1000" height="172" fill="#080C14"/>

    <!-- ghost mark, bleeding off the right edge -->
    <g transform="translate(886 40) scale(3.0)" fill="none" stroke="#00F2FE" stroke-opacity="0.075"
       stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="1" y="10" width="38" height="22" rx="11"/><path d="M10 16v8M6 20h8"/><circle cx="28" cy="17" r="2.4"/><circle cx="33" cy="23" r="2.4"/></g>

    <!-- left rule, draws in -->
    <rect x="0" y="0" width="3" height="0" fill="#00F2FE" fill-opacity="0.85">
      <animate attributeName="height" from="0" to="172" dur="0.7s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>

    <!-- ghost index numeral -->
    <text x="34" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#1B2739">03</text>

    <text x="118" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.2" fill="#EEF3F9">MOT</text>

    <g transform="translate(856.0 30)">
      <rect width="110.0" height="23" rx="3" fill="none" stroke="#00F2FE" stroke-opacity="0.4"/>
      
      <text x="55.0" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.3" fill="#00F2FE" fill-opacity="0.95">PLAY STORE</text>
    </g>

    

    <text x="118" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.0" fill="#8496AD">LFG matchmaking by game, platform and playstyle. Real-time chat, a 300+</text><text x="118" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.0" fill="#8496AD">game database via RAWG, automated moderation and a RevenueCat store.</text>

    <line x1="118" y1="132" x2="966" y2="132" stroke="#141E2C"/>
    <text x="118" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" fill="#5E7188">Flutter · Riverpod · Firebase · FCM · RevenueCat</text>

    <!-- slow sweep along the baseline: one moving accent, no glow -->
    <rect x="-200" y="170.5" width="200" height="1.5" fill="url(#sweep2)">
      <animate attributeName="x" values="-200;1000" dur="6s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <line x1="0" y1="171.25" x2="1000" y2="171.25" stroke="#131C2B" stroke-width="1.5"/>
  </g>
</svg>
