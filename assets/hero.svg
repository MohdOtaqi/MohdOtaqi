<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mohammad Otaqi — Software and Mobile Engineer">
  <title>Mohammad Otaqi — Software &amp; Mobile Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="52%" stop-color="#0A1123"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E8F4FF"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="22%" stop-color="#00F2FE" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#7C4DFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1B2740" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>

    <clipPath id="nameWipe">
      <rect x="60" y="90" height="70" width="0">
        <animate attributeName="width" from="0" to="620" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </clipPath>

    <clipPath id="t0">
      <rect x="92" y="172" height="26" width="0">
        <animate attributeName="width" values="0;326;326;0;0" keyTimes="0;0.1;0.2833;0.3333;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t1">
      <rect x="92" y="172" height="26" width="0">
        <animate attributeName="width" values="0;0;274;274;0;0" keyTimes="0;0.3333;0.4333;0.6167;0.6667;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="t2">
      <rect x="92" y="172" height="26" width="0">
        <animate attributeName="width" values="0;0;296;296;0" keyTimes="0;0.6667;0.7667;0.95;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>

    <!-- drifting ambient light -->
    <g filter="url(#soft)">
      <circle cx="180" cy="60" r="120" fill="#0B62FF" opacity="0.34">
        <animate attributeName="cx" values="180;300;140;180" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;120;40;60" dur="23s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="230" r="140" fill="#00F2FE" opacity="0.22">
        <animate attributeName="cx" values="1020;900;1080;1020" dur="27s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;170;250;230" dur="21s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="300" r="110" fill="#7C4DFF" opacity="0.2">
        <animate attributeName="cx" values="620;760;540;620" dur="31s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- orbital system, right -->
    <g transform="translate(1032 150)" opacity="0.95">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
        <circle r="96" fill="none" stroke="#25344F" stroke-width="1.2" stroke-dasharray="3 9"/>
        <circle cx="96" cy="0" r="3.5" fill="#7C4DFF"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="21s" repeatCount="indefinite"/>
        <circle r="70" fill="none" stroke="#00F2FE" stroke-opacity="0.32" stroke-width="1.4"/>
        <circle cx="70" cy="0" r="4.5" fill="#00F2FE"/>
      </g>
      <circle r="44" fill="#00F2FE" fill-opacity="0.06" stroke="#00F2FE" stroke-opacity="0.55" stroke-width="1.4">
        <animate attributeName="fill-opacity" values="0.05;0.13;0.05" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="#00F2FE" opacity="0.9">
        <animate attributeName="r" values="9;12;9" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="none" stroke="#00F2FE" stroke-width="1.5">
        <animate attributeName="r" values="10;46;46" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- status pill -->
    <g>
      <rect x="60" y="42" width="272" height="30" rx="15" fill="#0B1220" stroke="#00F2FE" stroke-opacity="0.45"/>
      <circle cx="80" cy="57" r="4" fill="#00F2FE">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="57" r="4" fill="none" stroke="#00F2FE" stroke-width="1">
        <animate attributeName="r" values="4;11;11" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.2" fill="#00F2FE">SOFTWARE &amp; MOBILE ENGINEER</text>
    </g>

    <!-- name -->
    <g clip-path="url(#nameWipe)">
      <text x="60" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1.5" fill="url(#nameGrad)">MOHAMMAD OTAQI</text>
    </g>

    <!-- terminal line -->
    <text x="60" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#00F2FE" opacity="0.9">&#8250;</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9FB3CE">
      <g clip-path="url(#t0)"><text x="92" y="192">ISO 15022 settlement pipelines</text></g>
      <g clip-path="url(#t1)"><text x="92" y="192">Flutter apps in production</text></g>
      <g clip-path="url(#t2)"><text x="92" y="192">real-time voice, video &amp; AI</text></g>
    </g>
    <rect y="176" width="10" height="20" fill="#00F2FE" x="92">
      <animate attributeName="x" values="92;418;418;92;92;366;366;92;92;388;388;92" keyTimes="0;0.1;0.2833;0.3333;0.3333;0.4333;0.6167;0.6667;0.6667;0.7667;0.95;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- meta line -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#64748B">
      <text x="60" y="238">ZagTrader</text>
      <text x="141" y="238" fill="#00F2FE">/</text>
      <text x="156" y="238">Amman, Jordan</text>
      <text x="264" y="238" fill="#00F2FE">/</text>
      <text x="279" y="238">B.Sc. Computer Science, HTU</text>
    </g>

    <!-- rules -->
    <rect x="120" y="0" width="800" height="2" fill="url(#rule)"/>
    <rect x="220" y="298" width="680" height="2" fill="url(#rule)"/>
    <rect width="1200" height="300" rx="18" fill="none" stroke="#1C2942" stroke-width="1.5"/>
  </g>
</svg>
