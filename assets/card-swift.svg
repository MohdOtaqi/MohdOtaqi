      <text x="56.0" y="16.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#60A5FA">ENTERPRISE</text>
    </g>

    <rect x="34" y="94" width="46" height="2" rx="1" fill="#60A5FA" fill-opacity="0.5"/>
