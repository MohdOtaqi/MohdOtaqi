    <circle cx="66" cy="58" r="130" fill="url(#halo6)"/>

    <rect x="-260" y="0" width="260" height="250" fill="url(#sheen6)">
      <animate attributeName="x" values="-260;600" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="600" height="2.5" fill="url(#top6)"/>

    <g transform="translate(34 34)"><rect x="1" y="2" width="13" height="10" rx="3" fill="none" stroke="#60A5FA" stroke-width="2"/><rect x="20" y="22" width="13" height="10" rx="3" fill="none" stroke="#60A5FA" stroke-width="2"/><path d="M7.5 12v9a5 5 0 0 0 5 5h7.5" fill="none" stroke="#60A5FA" stroke-width="2"/><path d="M26.5 12V2" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/><circle cx="26.5" cy="14" r="2.5" fill="#60A5FA"/></g>

    <text x="86" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F1F5F9">SWIFT Suite</text>
    <text x="86" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#60A5FA" fill-opacity="0.85">ZAGTRADER</text>

