    <g transform="translate(34.0 196)"><rect width="36.6" height="26" rx="7" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.30"/><text x="18.3" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">C#</text></g><g transform="translate(78.6 196)"><rect width="73.1" height="26" rx="7" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">.NET 10</text></g><g transform="translate(159.7 196)"><rect width="58.5" height="26" rx="7" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.30"/><text x="29.2" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">React</text></g><g transform="translate(226.2 196)"><rect width="73.1" height="26" rx="7" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">SignalR</text></g><g transform="translate(307.3 196)"><rect width="95.0" height="26" rx="7" fill="#60A5FA" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.30"/><text x="47.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">SQL Server</text></g>

