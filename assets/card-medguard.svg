<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="MedGuard - Graduation Project">
  <title>MedGuard</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101C"/><stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="top1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip1"><rect width="600" height="250" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip1)">
    <rect width="600" height="250" fill="url(#g1)"/>
    <circle cx="66" cy="58" r="130" fill="url(#halo1)"/>

    <rect x="-260" y="0" width="260" height="250" fill="url(#sheen1)">
      <animate attributeName="x" values="-260;600" dur="4.5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="600" height="2.5" fill="url(#top1)"/>

    <g transform="translate(34 34)"><rect x="1" y="3" width="32" height="26" rx="6" fill="none" stroke="#F472B6" stroke-width="2"/><path d="M5 17h5l3-7 4 14 3-7h8" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>

    <text x="86" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F1F5F9">MedGuard</text>
    <text x="86" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#F472B6" fill-opacity="0.85">GRADUATION PROJECT</text>

    <g transform="translate(511.6 26)">
      <rect width="54.4" height="24" rx="12" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.35"/>
      <circle cx="13" cy="12" r="3.2" fill="#F472B6"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="33.2" y="16.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#F472B6">CODE</text>
    </g>

    <rect x="34" y="94" width="46" height="2" rx="1" fill="#F472B6" fill-opacity="0.5"/>
    <text x="34" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Live vitals from BLE GATT hardware (0x180D/0x2A37)</text><text x="34" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">streamed to Firestore, analysed by a Gemini AI</text><text x="34" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Cloud Function, GPS emergency alerts over FCM.</text>
    <g transform="translate(34.0 196)"><rect width="73.1" height="26" rx="7" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">Flutter</text></g><g transform="translate(115.1 196)"><rect width="80.4" height="26" rx="7" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.30"/><text x="40.2" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">Firebase</text></g><g transform="translate(203.5 196)"><rect width="43.9" height="26" rx="7" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.30"/><text x="21.9" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">BLE</text></g><g transform="translate(255.4 196)"><rect width="65.8" height="26" rx="7" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.30"/><text x="32.9" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">Gemini</text></g>

    <rect width="600" height="250" rx="16" fill="none" stroke="#1A2739" stroke-width="1.5"/>
  </g>
</svg>
