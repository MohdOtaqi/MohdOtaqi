<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="Odispear - Community Platform">
  <title>Odispear</title>
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A101C"/><stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="top0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo0" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip0"><rect width="600" height="250" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip0)">
    <rect width="600" height="250" fill="url(#g0)"/>
    <circle cx="66" cy="58" r="130" fill="url(#halo0)"/>

    <rect x="-260" y="0" width="260" height="250" fill="url(#sheen0)">
      <animate attributeName="x" values="-260;600" dur="4.5s" begin="0.0s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="600" height="2.5" fill="url(#top0)"/>

    <g transform="translate(34 34)"><path d="M3 6h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H12l-6 5v-5H3a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" fill="none" stroke="#00F2FE" stroke-width="2"/><path d="M7 12v5M11.5 10v9M16 13v3M20.5 11v7" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/></g>

    <text x="86" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F1F5F9">Odispear</text>
    <text x="86" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.4" fill="#00F2FE" fill-opacity="0.85">COMMUNITY PLATFORM</text>

    <g transform="translate(511.6 26)">
      <rect width="54.4" height="24" rx="12" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-opacity="0.35"/>
      <circle cx="13" cy="12" r="3.2" fill="#00F2FE"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="33.2" y="16.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#00F2FE">LIVE</text>
    </g>

    <rect x="34" y="94" width="46" height="2" rx="1" fill="#00F2FE" fill-opacity="0.5"/>
    <text x="34" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Discord-style servers, channels and roles with</text><text x="34" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">low-latency LiveKit voice + video and RNNoise</text><text x="34" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">suppression. Stripe subscriptions, Postgres on RDS.</text>
    <g transform="translate(34.0 196)"><rect width="58.5" height="26" rx="7" fill="#00F2FE" fill-opacity="0.10" stroke="#00F2FE" stroke-opacity="0.30"/><text x="29.2" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">React</text></g><g transform="translate(100.5 196)"><rect width="73.1" height="26" rx="7" fill="#00F2FE" fill-opacity="0.10" stroke="#00F2FE" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">Node.js</text></g><g transform="translate(181.6 196)"><rect width="95.0" height="26" rx="7" fill="#00F2FE" fill-opacity="0.10" stroke="#00F2FE" stroke-opacity="0.30"/><text x="47.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">PostgreSQL</text></g><g transform="translate(284.6 196)"><rect width="73.1" height="26" rx="7" fill="#00F2FE" fill-opacity="0.10" stroke="#00F2FE" stroke-opacity="0.30"/><text x="36.5" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">LiveKit</text></g><g transform="translate(365.7 196)"><rect width="43.9" height="26" rx="7" fill="#00F2FE" fill-opacity="0.10" stroke="#00F2FE" stroke-opacity="0.30"/><text x="21.9" y="17.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" fill="#B9C7DA">AWS</text></g>

    <rect width="600" height="250" rx="16" fill="none" stroke="#1A2739" stroke-width="1.5"/>
  </g>
</svg>
