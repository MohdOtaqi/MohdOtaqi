name: stats

# Regenerates assets/stats.svg (contribution heatmap + stat tiles) daily.
#
# No secrets, no PAT, no self-hosted runner: scripts/build_stats.py reads the
# public https://github.com/users/<login>/contributions endpoint, which needs
# no authentication and already includes private-repo contributions.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stats.svg
        env:
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/build_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh contribution stats"
          git push
